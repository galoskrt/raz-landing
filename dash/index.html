<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>הלידים של רז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink2:#1B1E23; --line:#2A2E34; --line2:#3A3F47;
  --bone:#FAF8F5; --stone:#C9C6C2; --muted:#8A8580; --faint:#6F6A65;
  --red:#C2151C; --red2:#D82127; --green:#3FA05B; --amber:#C98A2E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);direction:rtl;
  font-family:Heebo,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ── login ─────────────────────────────────────────────────────────── */
#login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:360px;text-align:center}
#login svg{margin:0 auto 26px;display:block}
#login h1{font-size:26px;font-weight:200;margin-bottom:6px}
#login h1 b{font-weight:500}
#login p{font-size:13.5px;color:var(--muted);margin-bottom:26px}
.fld{width:100%;height:52px;background:var(--ink2);border:1px solid var(--line);
  border-radius:13px;padding:0 16px;margin-bottom:10px;color:var(--bone);text-align:right}
.fld:focus{outline:none;border-color:var(--stone)}
.fld::placeholder{color:var(--faint)}
.btn{width:100%;height:54px;border-radius:15px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,var(--red2) 0%,var(--red) 52%,#8F081B 100%);
  box-shadow:0 10px 26px rgba(194,21,28,.28)}
.btn:active{transform:translateY(1px)}
.err{color:var(--red2);font-size:13px;margin-top:12px;min-height:18px}

/* ── shell ─────────────────────────────────────────────────────────── */
#app{display:none}
header{position:sticky;top:0;z-index:20;background:rgba(20,22,26,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px}
header .who{flex:1;min-width:0}
header .who b{display:block;font-size:15px;font-weight:500;line-height:1.2}
header .who span{font-size:11.5px;color:var(--faint)}
.ghost{border:1px solid var(--line2);border-radius:10px;padding:8px 11px;
  font-size:12.5px;color:var(--stone)}
.ghost:disabled{opacity:.35}

.bar{padding:14px 16px 4px;display:flex;gap:8px;flex-wrap:wrap}
.bar input,.bar select{height:42px;background:var(--ink2);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;color:var(--bone)}
.bar input{flex:1;min-width:150px;text-align:right}
.bar select{max-width:170px}

.tot{padding:6px 16px 0;font-size:12.5px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.tot b{color:var(--stone);font-weight:500}
.tot .warn{color:var(--red2)}

/* ── lead cards ────────────────────────────────────────────────────── */
#list{padding:12px 16px 120px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;position:relative;overflow:hidden}
.card.unsent{border-color:rgba(194,21,28,.55)}
.card.unsent::before{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--red)}
.top{display:flex;align-items:flex-start;gap:10px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16.5px;font-weight:500;line-height:1.3}
.nm span{font-size:12.5px;color:var(--faint)}
.pill{font-size:11.5px;padding:5px 10px;border-radius:999px;background:#24272D;
  color:var(--stone);white-space:nowrap;border:1px solid var(--line2)}
.pill.hot{background:rgba(194,21,28,.16);border-color:rgba(194,21,28,.5);color:#FF8C8C}
.pill.good{background:rgba(63,160,91,.16);border-color:rgba(63,160,91,.45);color:#84D69B}

.read{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.meter{flex:1;height:5px;background:#24272D;border-radius:3px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--stone);border-radius:3px}
.meter i.deep{background:var(--green)}
.live{display:inline-flex;align-items:center;gap:6px;color:#84D69B;font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:#84D69B;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.none{color:var(--faint)}

.acts{margin-top:12px;display:flex;gap:8px}
.acts button{flex:1;height:42px;border-radius:11px;font-size:13.5px;font-weight:500;
  border:1px solid var(--line2);color:var(--stone)}
.acts .send{border:0;color:#fff;background:linear-gradient(135deg,var(--red2),#8F081B)}

/* ── modal ─────────────────────────────────────────────────────────── */
#modal{position:fixed;inset:0;z-index:40;background:rgba(8,10,13,.72);
  display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92svh;overflow:auto;background:var(--ink2);
  border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 28px}
.sheet h2{font-size:20px;font-weight:500;margin-bottom:2px}
.sheet .sub{font-size:12.5px;color:var(--faint);margin-bottom:18px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 6px;display:block}
.sheet textarea{width:100%;min-height:88px;background:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:12px;color:var(--bone);resize:vertical;text-align:right}
.sheet select,.sheet input{width:100%;height:48px;background:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;color:var(--bone);text-align:right}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.sheet .close{position:absolute;inset:0;z-index:-1}
.mact{display:flex;gap:8px;margin-top:20px}
.mact button{flex:1;height:50px;border-radius:14px;font-weight:500}
.mact .save{color:#fff;background:linear-gradient(135deg,var(--red2),#8F081B)}
.mact .cancel{border:1px solid var(--line2);color:var(--stone)}
.hist{margin-top:16px;font-size:12.5px;color:var(--faint);line-height:1.9}

@media (min-width:760px){
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  #modal{align-items:center}
  .sheet{border-radius:22px}
}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <svg width="30" height="36" viewBox="0 0 70 82" fill="none" aria-hidden="true">
      <path d="M5 74 L5 33 A30 30 0 0 1 65 33 L65 74" stroke="#FAF8F5" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M2 79 L68 79" stroke="#C2151C" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <h1>הלידים <b>שלך</b></h1>
    <p>רז מאיר כהן · מקבוצת תום הרוש</p>
    <input class="fld" id="u" placeholder="שם משתמש" autocomplete="username">
    <input class="fld" id="p" type="password" placeholder="סיסמה" autocomplete="current-password">
    <button class="btn" id="go">כניסה</button>
    <div class="err" id="e"></div>
  </div>
</section>

<section id="app">
  <header>
    <div class="who"><b>הלידים שלך</b><span id="stamp">טוען…</span></div>
    <button class="ghost" id="undo" disabled>בטל</button>
    <button class="ghost" id="add">ליד חדש</button>
    <button class="ghost" id="out">יציאה</button>
  </header>

  <div class="bar">
    <input id="q" placeholder="חיפוש לפי שם או טלפון">
    <select id="fs"><option value="">כל הסטטוסים</option></select>
  </div>
  <div class="tot" id="tot"></div>
  <div id="list"></div>
</section>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const API = "https://raz-leads.tom-harush.workers.dev";
const SITE = "https://tom-harush.co.il/raz-meir-cohen";
const LIVE_WINDOW = 45000;      // a heartbeat this fresh means they are reading now
const POLL = 10000;

let TOKEN = localStorage.getItem("raz_tok") || "";
let LEADS = [], STATUSES = [], UNDO = [];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: "Bearer " + TOKEN, ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  return r.json();
}

// ── login ───────────────────────────────────────────────────────────
async function login() {
  $("#e").textContent = "";
  const r = await fetch(API + "/login", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ username: $("#u").value.trim(), password: $("#p").value }),
  });
  const d = await r.json();
  if (!r.ok) {
    $("#e").textContent = r.status === 429
      ? "יותר מדי ניסיונות. ננסה שוב בעוד רבע שעה."
      : "שם משתמש או סיסמה לא נכונים.";
    return;
  }
  TOKEN = d.token;
  localStorage.setItem("raz_tok", TOKEN);
  STATUSES = d.statuses || [];
  start();
}
function logout() {
  TOKEN = ""; localStorage.removeItem("raz_tok");
  $("#app").style.display = "none"; $("#login").style.display = "flex";
}

// ── time and reading language ───────────────────────────────────────
function ago(iso) {
  if (!iso) return "";
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "עכשיו";
  if (m < 60) return "לפני " + m + " דק׳";
  const h = Math.floor(m / 60);
  if (h < 24) return "לפני " + h + " שע׳";
  const d = Math.floor(h / 24);
  return d === 1 ? "אתמול" : "לפני " + d + " ימים";
}
function mins(s) {
  if (!s) return "0";
  if (s < 60) return s + " שנ׳";
  return (s / 60).toFixed(s < 600 ? 1 : 0) + " דק׳";
}
/**
 * Depth on its own lies: someone can flick to the bottom in seconds just to see
 * how long it is. The verdict needs both numbers together.
 */
function verdict(l) {
  if (!l.opens) return { t: "טרם נפתח", c: "none" };
  if (l.read_seconds < 25) return { t: "רפרף ויצא", c: "none" };
  if (l.read_seconds >= 240 && l.read_depth >= 50) return { t: "קרא ברצינות", c: "good" };
  if (l.read_depth >= 80 && l.read_seconds < 60) return { t: "בדק אורך", c: "none" };
  return { t: "בתוך הקריאה", c: "" };
}
const isLive = l => l.last_seen_at && (Date.now() - new Date(l.last_seen_at)) < LIVE_WINDOW;

function waHref(l) {
  const intl = "972" + String(l.phone).replace(/\D/g, "").replace(/^0/, "");
  const first = (l.name || "").split(" ")[0];
  const msg = "היי " + first + ", הנה המדריך שלך.\n" + SITE + "/madrich/" + l.token +
    "\nאם עולה שאלה תוך כדי הקריאה, אפשר פשוט לכתוב לי. אני קורא הכל בעצמי.";
  return "https://wa.me/" + intl + "?text=" + encodeURIComponent(msg);
}

// ── render ──────────────────────────────────────────────────────────
function render() {
  const q = $("#q").value.trim();
  const fs = $("#fs").value;
  const rows = LEADS.filter(l =>
    (!fs || l.status === fs) &&
    (!q || (l.name + " " + l.phone).indexOf(q) !== -1));

  const unsent = LEADS.filter(l => !l.guide_sent).length;
  const reading = LEADS.filter(isLive).length;
  $("#tot").innerHTML =
    "<span>סה״כ <b>" + LEADS.length + "</b></span>" +
    (unsent ? "<span class='warn'>טרם נשלח מדריך <b>" + unsent + "</b></span>" : "") +
    (reading ? "<span class='live'><i></i>קוראים עכשיו " + reading + "</span>" : "");

  $("#list").innerHTML = rows.map(l => {
    const v = verdict(l), live = isLive(l);
    return "<div class='card" + (l.guide_sent ? "" : " unsent") + "' data-id='" + l.id + "'>" +
      "<div class='top'><div class='nm'><b>" + esc(l.name) + "</b>" +
        "<span>" + esc(l.phone) + " · " + ago(l.created_at) +
        (l.source === "manual" ? " · ידני" : "") + "</span></div>" +
        "<span class='pill" + (l.status === "נמכר" || l.status === "חתם בלעדיות" ? " good" : "") + "'>" +
        esc(l.status) + "</span></div>" +

      "<div class='read'>" + (live
        ? "<span class='live'><i></i>קורא עכשיו</span>"
        : "<span class='" + v.c + "'>" + v.t + "</span>") +
        "<span class='meter'><i class='" + (l.read_depth >= 70 ? "deep" : "") + "' style='width:" +
        (l.read_depth || 0) + "%'></i></span>" +
        "<span>" + (l.read_depth || 0) + "% · " + mins(l.read_seconds) +
        (l.visits > 1 ? " · " + l.visits + " ביקורים" : "") + "</span></div>" +

      "<div class='acts'>" +
        (l.guide_sent
          ? "<button data-wa='" + l.id + "'>וואטסאפ</button>"
          : "<button class='send' data-send='" + l.id + "'>שלח מדריך</button>") +
        "<button data-tel='" + l.id + "'>חיוג</button>" +
        "<button data-open='" + l.id + "'>פרטים</button>" +
      "</div></div>";
  }).join("") || "<div class='tot'>אין לידים שתואמים לסינון.</div>";

  $("#stamp").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
}

async function load() {
  const d = await api("/leads");
  LEADS = d.leads || [];
  if (d.statuses) STATUSES = d.statuses;
  if (!$("#fs").options.length || $("#fs").options.length === 1) {
    $("#fs").innerHTML = "<option value=''>כל הסטטוסים</option>" +
      STATUSES.map(s => "<option>" + esc(s) + "</option>").join("");
  }
  render();
}

// ── actions ─────────────────────────────────────────────────────────
function pushUndo(fn, label) { UNDO.push({ fn, label }); $("#undo").disabled = false; }

async function sendGuide(id) {
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  window.open(waHref(l), "_blank");
  await api("/leads/" + id + "/sent", { method: "POST" });
  pushUndo(async () => { await api("/leads/" + id, { method: "PATCH", body: JSON.stringify({ status: l.status }) }); }, "שליחה");
  load();
}

async function patch(id, body) {
  const before = LEADS.find(x => x.id === id) || {};
  const undoBody = {};
  Object.keys(body).forEach(k => { undoBody[k] = before[k]; });
  await api("/leads/" + id, { method: "PATCH", body: JSON.stringify(body) });
  pushUndo(async () => { await api("/leads/" + id, { method: "PATCH", body: JSON.stringify(undoBody) }); }, "עריכה");
  await load();
}

function openLead(id) {
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  const sold = l.status === "נמכר";
  $("#sheet").innerHTML =
    "<h2>" + esc(l.name) + "</h2>" +
    "<div class='sub'>" + esc(l.phone) + (l.email ? " · " + esc(l.email) : "") + "</div>" +

    "<label class='lbl'>סטטוס</label>" +
    "<select id='m_status'>" + STATUSES.map(s =>
      "<option" + (s === l.status ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select>" +

    "<div id='m_comm' style='display:" + (sold ? "block" : "none") + "'>" +
      "<label class='lbl'>דמי תיווך שהתקבלו, בשקלים</label>" +
      "<input id='m_commission' inputmode='numeric' value='" + (l.commission || "") + "'>" +
    "</div>" +

    "<label class='lbl'>כתובת הנכס</label>" +
    "<input id='m_address' value='" + esc(l.address || "") + "'>" +

    "<label class='lbl'>הערות</label>" +
    "<textarea id='m_notes'>" + esc(l.notes || "") + "</textarea>" +

    "<div class='row2'><div><label class='lbl'>קישור למסמך</label>" +
      "<input id='m_doc' value='" + esc(l.doc_url || "") + "' dir='ltr'></div>" +
      "<div><label class='lbl'>תזכורת</label>" +
      "<input id='m_rem' type='date' value='" + (l.reminder_at || "").slice(0, 10) + "'></div></div>" +

    "<div class='hist'>" +
      "נכנס " + ago(l.created_at) + (l.guide_sent_at ? " · מדריך נשלח " + ago(l.guide_sent_at) : " · מדריך טרם נשלח") +
      (l.opens ? " · נפתח " + l.opens + " פעמים, " + mins(l.read_seconds) + " קריאה, " + l.read_depth + "%" : "") +
      "<br>הקישור האישי: <span dir='ltr'>" + SITE + "/madrich/" + l.token + "</span>" +
    "</div>" +

    "<div class='mact'><button class='cancel' id='m_x'>סגירה</button>" +
    "<button class='save' id='m_ok'>שמירה</button></div>";

  $("#m_status").onchange = e => {
    $("#m_comm").style.display = e.target.value === "נמכר" ? "block" : "none";
  };
  $("#m_x").onclick = () => $("#modal").classList.remove("on");
  $("#m_ok").onclick = async () => {
    const body = {
      status: $("#m_status").value,
      address: $("#m_address").value,
      notes: $("#m_notes").value,
      doc_url: $("#m_doc").value,
      reminder_at: $("#m_rem").value || null,
    };
    const c = parseFloat($("#m_commission") ? $("#m_commission").value : "");
    if (!isNaN(c)) body.commission = c;
    $("#modal").classList.remove("on");
    await patch(id, body);
  };
  $("#modal").classList.add("on");
}

function addLead() {
  $("#sheet").innerHTML =
    "<h2>ליד חדש</h2><div class='sub'>מישהו שהגיע אליך מחוץ לדף</div>" +
    "<label class='lbl'>שם מלא</label><input id='a_name'>" +
    "<label class='lbl'>טלפון</label><input id='a_phone' inputmode='tel' dir='ltr'>" +
    "<label class='lbl'>אימייל</label><input id='a_email' dir='ltr'>" +
    "<label class='lbl'>כתובת הנכס</label><input id='a_address'>" +
    "<div class='mact'><button class='cancel' id='a_x'>ביטול</button>" +
    "<button class='save' id='a_ok'>הוספה</button></div>";
  $("#a_x").onclick = () => $("#modal").classList.remove("on");
  $("#a_ok").onclick = async () => {
    const b = {
      name: $("#a_name").value.trim(), phone: $("#a_phone").value.trim(),
      email: $("#a_email").value.trim(), address: $("#a_address").value.trim(),
    };
    if (!b.name || b.phone.length < 9) return;
    $("#modal").classList.remove("on");
    await api("/leads", { method: "POST", body: JSON.stringify(b) });
    load();
  };
  $("#modal").classList.add("on");
}

// ── wiring ──────────────────────────────────────────────────────────
$("#go").onclick = login;
$("#p").onkeydown = e => { if (e.key === "Enter") login(); };
$("#out").onclick = logout;
$("#add").onclick = addLead;
$("#q").oninput = render;
$("#fs").onchange = render;
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("on"); };

$("#undo").onclick = async () => {
  const step = UNDO.pop();
  if (!step) return;
  await step.fn();
  $("#undo").disabled = !UNDO.length;
  load();
};

$("#list").onclick = e => {
  const b = e.target.closest("button");
  if (b) {
    if (b.dataset.send) return sendGuide(b.dataset.send);
    if (b.dataset.open) return openLead(b.dataset.open);
    const l = LEADS.find(x => x.id === (b.dataset.wa || b.dataset.tel));
    if (!l) return;
    if (b.dataset.wa) window.open(waHref(l), "_blank");
    if (b.dataset.tel) location.href = "tel:" + l.phone;
    return;
  }
  const card = e.target.closest(".card");
  if (card) openLead(card.dataset.id);
};

function start() {
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  load();
  setInterval(() => { if (!document.hidden) load(); }, POLL);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}

if (TOKEN) api("/leads").then(d => { STATUSES = d.statuses || []; start(); }).catch(() => {});
</script>
</body>
</html>
