<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>הלידים של רז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink2:#1B1E23; --ink3:#24272D; --line:#2A2E34; --line2:#3A3F47;
  --bone:#FAF8F5; --stone:#C9C6C2; --muted:#8A8580; --faint:#6F6A65;
  --red:#C2151C; --red2:#D82127; --green:#84D69B; --amber:#E0B15C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);direction:rtl;
  font-family:Heebo,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

/* ── login ─────────────────────────────────────────────────────────── */
#login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:360px;text-align:center}
#login svg{margin:0 auto 26px;display:block}
#login h1{font-size:26px;font-weight:200;margin-bottom:6px}
#login h1 b{font-weight:500}
#login p{font-size:13.5px;color:var(--muted);margin-bottom:26px}
.fld{width:100%;height:52px;background:var(--ink2);border:1px solid var(--line);
  border-radius:13px;padding:0 16px;margin-bottom:10px;color:var(--bone);text-align:right}
.fld:focus{outline:none;border-color:var(--stone)}
.fld::placeholder{color:var(--faint)}
.btn{width:100%;height:54px;border-radius:15px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,var(--red2) 0%,var(--red) 52%,#8F081B 100%);
  box-shadow:0 10px 26px rgba(194,21,28,.28)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6}
.err{color:var(--red2);font-size:13px;margin-top:12px;min-height:18px}

/* ── shell ─────────────────────────────────────────────────────────── */
#app{display:none}
header{position:sticky;top:0;z-index:20;background:rgba(20,22,26,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;
  display:flex;align-items:center;gap:8px}
header .who{flex:1;min-width:0}
header .who b{display:block;font-size:15px;font-weight:500;line-height:1.25}
header .who span{font-size:11.5px;color:var(--faint)}
.ghost{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;
  font-size:12.5px;color:var(--stone);white-space:nowrap}
.ghost:disabled{opacity:.3}
.ghost.on{border-color:var(--stone);color:var(--bone)}

.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tabs button{flex:1;height:38px;border-radius:11px;font-size:13.5px;color:var(--muted);
  border:1px solid var(--line)}
.tabs button.on{background:var(--ink2);color:var(--bone);border-color:var(--line2)}

.bar{padding:12px 16px 4px;display:flex;gap:8px;flex-wrap:wrap}
.bar input,.bar select{height:42px;background:var(--ink2);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;color:var(--bone)}
.bar input{flex:1;min-width:140px;text-align:right}
.bar select{max-width:160px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--line2)}

.tot{padding:8px 16px 0;font-size:12.5px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.tot b{color:var(--stone);font-weight:500}
.tot .warn{color:var(--red2)}
.tot .live{color:var(--green)}

/* ── lead cards ────────────────────────────────────────────────────── */
#list{padding:12px 16px 90px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;position:relative;overflow:hidden}
.card.unsent{border-color:rgba(194,21,28,.55)}
.card.unsent::before{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--red)}
.card.due{border-color:rgba(224,177,92,.5)}
.top{display:flex;align-items:flex-start;gap:10px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16.5px;font-weight:500;line-height:1.3}
.nm span{font-size:12.5px;color:var(--faint)}
.pill{font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--ink3);
  color:var(--stone);white-space:nowrap;border:1px solid var(--line2)}
.pill.good{background:rgba(63,160,91,.16);border-color:rgba(63,160,91,.45);color:var(--green)}
.pill.dead{opacity:.5}

.read{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.meter{flex:1;height:5px;background:var(--ink3);border-radius:3px;overflow:hidden;min-width:50px}
.meter i{display:block;height:100%;background:var(--stone);border-radius:3px;transition:width .4s}
.meter i.deep{background:var(--green)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:500}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.none{color:var(--faint)}
.good{color:var(--green)}

.nudge{margin-top:11px;background:rgba(224,177,92,.09);border:1px solid rgba(224,177,92,.3);
  border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.nudge .t{flex:1;min-width:0;font-size:12.5px;color:var(--amber);line-height:1.5}
.nudge button{border:1px solid rgba(224,177,92,.5);border-radius:9px;padding:8px 12px;
  font-size:12.5px;color:var(--amber);white-space:nowrap}

.acts{margin-top:12px;display:flex;gap:8px}
.acts button{flex:1;height:42px;border-radius:11px;font-size:13.5px;font-weight:500;
  border:1px solid var(--line2);color:var(--stone)}
.acts .send{border:0;color:#fff;background:linear-gradient(135deg,var(--red2),#8F081B)}
.empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:14px;line-height:1.8}

/* ── performance ───────────────────────────────────────────────────── */
#perf{padding:14px 16px 90px;display:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi span{display:block;font-size:11.5px;color:var(--faint);margin-bottom:6px}
.kpi b{font-size:23px;font-weight:300}
.kpi.wide{grid-column:1 / -1}
.note{margin-top:14px;background:var(--ink2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.75}
.note b{color:var(--stone);font-weight:500}

/* ── modal ─────────────────────────────────────────────────────────── */
#modal{position:fixed;inset:0;z-index:40;background:rgba(8,10,13,.74);
  display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92svh;overflow:auto;background:var(--ink2);
  border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 28px}
.sheet h2{font-size:20px;font-weight:500;margin-bottom:2px}
.sheet .sub{font-size:12.5px;color:var(--faint);margin-bottom:16px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 6px;display:block}
.sheet textarea{width:100%;min-height:84px;background:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:12px;color:var(--bone);resize:vertical;text-align:right}
.sheet select,.sheet input{width:100%;height:48px;background:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;color:var(--bone);text-align:right}
.sheet textarea:focus,.sheet select:focus,.sheet input:focus{outline:none;border-color:var(--line2)}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.mact{display:flex;gap:8px;margin-top:20px}
.mact button{flex:1;height:50px;border-radius:14px;font-weight:500}
.mact .save{color:#fff;background:linear-gradient(135deg,var(--red2),#8F081B)}
.mact .cancel{border:1px solid var(--line2);color:var(--stone)}
.hist{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);line-height:1.95}
.hist .k{color:var(--stone)}
.copy{margin-top:8px;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;
  font-size:12px;color:var(--stone)}

.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:60;
  background:var(--ink3);border:1px solid var(--line2);border-radius:12px;
  padding:12px 18px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (min-width:760px){
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
  .kpis{grid-template-columns:repeat(4,1fr)}
  #modal{align-items:center}
  .sheet{border-radius:22px}
  .tabs{max-width:420px}
}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <svg width="30" height="36" viewBox="0 0 70 82" fill="none" aria-hidden="true">
      <path d="M5 74 L5 33 A30 30 0 0 1 65 33 L65 74" stroke="#FAF8F5" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M2 79 L68 79" stroke="#C2151C" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <h1>הלידים <b>שלך</b></h1>
    <p>רז מאיר כהן · מקבוצת תום הרוש</p>
    <input class="fld" id="u" placeholder="שם משתמש" autocomplete="username">
    <input class="fld" id="p" type="password" placeholder="סיסמה" autocomplete="current-password">
    <button class="btn" id="go">כניסה</button>
    <div class="err" id="e"></div>
  </div>
</section>

<section id="app">
  <header>
    <div class="who"><b>הלידים שלך</b><span id="stamp">טוען…</span></div>
    <button class="ghost" id="undo" disabled>בטל</button>
    <button class="ghost" id="add">ליד חדש</button>
    <button class="ghost" id="out">יציאה</button>
  </header>

  <div class="tabs">
    <button id="t_leads" class="on">לידים</button>
    <button id="t_perf">ביצועים</button>
  </div>

  <div id="leadsView">
    <div class="bar">
      <input id="q" placeholder="חיפוש לפי שם או טלפון">
      <select id="fs"><option value="">כל הסטטוסים</option></select>
      <select id="fd">
        <option value="0">כל הזמן</option>
        <option value="1">היום</option>
        <option value="7">שבעה ימים</option>
        <option value="30">שלושים יום</option>
      </select>
    </div>
    <div class="tot" id="tot"></div>
    <div id="list"></div>
  </div>

  <div id="perf"></div>
</section>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const API  = "https://raz-leads.tom-harush.workers.dev";
const SITE = "https://tom-harush.co.il/raz-meir-cohen";
const LIVE_WINDOW = 45000;   // a heartbeat this fresh means they are reading right now
const POLL = 10000;
const DEAD = ["לא רלוונטי", "מספר לא תקין", "נמכר"];

let TOKEN = localStorage.getItem("raz_tok") || "";
let LEADS = [], STATUSES = [], UNDO = [], TAB = "leads", timer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const days = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : 999;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("on"), 2400);
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: "Bearer " + TOKEN, ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  return r.json();
}

// ── login ───────────────────────────────────────────────────────────
async function login() {
  $("#e").textContent = ""; $("#go").disabled = true;
  try {
    const r = await fetch(API + "/login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ username: $("#u").value.trim(), password: $("#p").value }),
    });
    const d = await r.json();
    if (!r.ok) {
      $("#e").textContent = r.status === 429
        ? "יותר מדי ניסיונות. אפשר לנסות שוב בעוד רבע שעה."
        : "שם משתמש או סיסמה לא נכונים.";
      return;
    }
    TOKEN = d.token; localStorage.setItem("raz_tok", TOKEN);
    STATUSES = d.statuses || [];
    start();
  } catch (err) {
    $("#e").textContent = "אין חיבור כרגע. כדאי לנסות שוב.";
  } finally { $("#go").disabled = false; }
}
function logout() {
  TOKEN = ""; localStorage.removeItem("raz_tok");
  if (timer) clearInterval(timer);
  $("#app").style.display = "none"; $("#login").style.display = "flex";
}

// ── language for time and reading ───────────────────────────────────
function ago(iso) {
  if (!iso) return "";
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "עכשיו";
  if (m < 60) return "לפני " + m + " דק׳";
  const h = Math.floor(m / 60);
  if (h < 24) return "לפני " + h + " שע׳";
  const d = Math.floor(h / 24);
  return d === 1 ? "אתמול" : "לפני " + d + " ימים";
}
function mins(s) {
  if (!s) return "0";
  if (s < 60) return s + " שנ׳";
  return (s / 60).toFixed(s < 600 ? 1 : 0) + " דק׳";
}
/**
 * Depth on its own lies: a person can flick to the bottom in two seconds just to
 * see how long the guide is. Only depth and attention time together say anything.
 */
function verdict(l) {
  if (!l.opens && !l.read_seconds) return { t: "טרם נפתח", c: "none" };
  if (l.read_seconds < 25) return { t: "רפרף ויצא", c: "none" };
  if (l.read_seconds >= 240 && l.read_depth >= 50) return { t: "קרא ברצינות", c: "good" };
  if (l.read_depth >= 80 && l.read_seconds < 60) return { t: "בדק אורך", c: "none" };
  return { t: "בתוך הקריאה", c: "" };
}
const isLive = l => l.last_seen_at && (Date.now() - new Date(l.last_seen_at)) < LIVE_WINDOW;

function first(l) { return (l.name || "").split(" ")[0]; }
function wa(phone, msg) {
  const intl = "972" + String(phone).replace(/\D/g, "").replace(/^0/, "");
  return "https://wa.me/" + intl + "?text=" + encodeURIComponent(msg);
}
function guideMsg(l) {
  return "היי " + first(l) + ", הנה המדריך שלך.\n" + SITE + "/madrich/" + l.token +
    "\nאם עולה שאלה תוך כדי הקריאה, אפשר פשוט לכתוב לי. אני קורא הכל בעצמי.";
}

/**
 * The follow-up the moment actually calls for.
 *
 * This is where leads die, so the dashboard picks the message rather than asking
 * Raz to. Each one is written to be easy to answer and never to sound like
 * chasing: a question that sorts the person, an offer of help, or a real number
 * from their street. Never "רצית להתקדם?".
 */
function nudge(l) {
  if (!l.guide_sent || DEAD.indexOf(l.status) !== -1) return null;
  const since = days(l.guide_sent_at || l.created_at);
  const done = l.last_followup;

  if (!l.opens && since >= 1 && done !== "not_opened") {
    return { kind: "not_opened", why: "קיבל מדריך ולא פתח",
      msg: "היי " + first(l) + ", שלחתי לך את המדריך. אם משהו לא נפתח, אפשר להגיד לי ואני אשלח שוב." };
  }
  if (l.opens && l.read_seconds >= 60 && since >= 1 && done !== "read") {
    return { kind: "read", why: "קרא את המדריך, שווה לשאול",
      msg: "היי " + first(l) + ", שאלה קצרה. הנכס כבר בשוק, או שאנחנו עדיין בשלב של לבדוק מחיר?" };
  }
  if (since >= 3 && done !== "cold") {
    return { kind: "cold", why: "שלושה ימים בלי תגובה",
      msg: "היי " + first(l) + ", בלי קשר למדריך. נסגרה לאחרונה עסקה באזור שלך, ואני חושב שהמספר " +
           "יעניין אותך כנקודת ייחוס. רוצה שאשלח?" };
  }
  return null;
}

// ── render ──────────────────────────────────────────────────────────
function filtered() {
  const q = $("#q").value.trim();
  const fs = $("#fs").value;
  const fd = parseInt($("#fd").value, 10);
  return LEADS.filter(l =>
    (!fs || l.status === fs) &&
    (!fd || days(l.created_at) < fd) &&
    (!q || (l.name + " " + l.phone).indexOf(q) !== -1));
}

function render() {
  const rows = filtered();
  const unsent = LEADS.filter(l => !l.guide_sent).length;
  const reading = LEADS.filter(isLive).length;
  const due = LEADS.filter(l => nudge(l)).length;

  $("#tot").innerHTML =
    "<span>מוצגים <b>" + rows.length + "</b> מתוך " + LEADS.length + "</span>" +
    (unsent ? "<span class='warn'>טרם נשלח מדריך <b>" + unsent + "</b></span>" : "") +
    (due ? "<span style='color:var(--amber)'>ממתינים למעקב <b>" + due + "</b></span>" : "") +
    (reading ? "<span class='live'><i></i>קוראים עכשיו " + reading + "</span>" : "");

  if (!rows.length) {
    $("#list").innerHTML = "<div class='empty'>" +
      (LEADS.length ? "אין לידים שתואמים לסינון." :
       "עוד לא נכנסו לידים.<br>ברגע שמישהו ימלא את הטופס בדף, הוא יופיע כאן.") + "</div>";
    $("#stamp").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
    return;
  }

  $("#list").innerHTML = rows.map(l => {
    const v = verdict(l), live = isLive(l), n = nudge(l);
    return "<div class='card" + (l.guide_sent ? "" : " unsent") + (n ? " due" : "") +
        "' data-id='" + l.id + "'>" +
      "<div class='top'><div class='nm'><b>" + esc(l.name) + "</b>" +
        "<span>" + esc(l.phone) + " · " + ago(l.created_at) +
        (l.source === "manual" ? " · ידני" : "") + "</span></div>" +
        "<span class='pill" + (l.status === "נמכר" || l.status === "חתם בלעדיות" ? " good" :
          (DEAD.indexOf(l.status) !== -1 ? " dead" : "")) + "'>" + esc(l.status) + "</span></div>" +

      "<div class='read'>" + (live
        ? "<span class='live'><i></i>קורא עכשיו</span>"
        : "<span class='" + v.c + "'>" + v.t + "</span>") +
        "<span class='meter'><i class='" + (l.read_depth >= 70 ? "deep" : "") + "' style='width:" +
        (l.read_depth || 0) + "%'></i></span>" +
        "<span>" + (l.read_depth || 0) + "% · " + mins(l.read_seconds) +
        (l.visits > 1 ? " · " + l.visits + " ביקורים" : "") + "</span></div>" +

      (n ? "<div class='nudge'><div class='t'>" + esc(n.why) + "</div>" +
           "<button data-nudge='" + l.id + "'>שלח מעקב</button></div>" : "") +

      "<div class='acts'>" +
        (l.guide_sent
          ? "<button data-wa='" + l.id + "'>וואטסאפ</button>"
          : "<button class='send' data-send='" + l.id + "'>שלח מדריך</button>") +
        "<button data-tel='" + l.id + "'>חיוג</button>" +
        "<button data-open='" + l.id + "'>פרטים</button>" +
      "</div></div>";
  }).join("");

  $("#stamp").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
}

/**
 * The measurement spine ships built but folded. With no ad spend, cost per lead
 * and ROAS are zeros that only mislead, so the view leads with the numbers Raz
 * actually has and says plainly what unlocks the rest.
 */
function renderPerf() {
  const L = filtered();
  const n = L.length;
  const sent = L.filter(l => l.guide_sent).length;
  const opened = L.filter(l => l.opens).length;
  const realRead = L.filter(l => l.read_seconds >= 240 && l.read_depth >= 50).length;
  const met = L.filter(l => l.status === "פגישה התקיימה" || l.exclusive_at || l.sold_at).length;
  const excl = L.filter(l => l.exclusive_at).length;
  const sold = L.filter(l => l.sold_at).length;
  const revenue = L.reduce((a, l) => a + (parseFloat(l.commission) || 0), 0);
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "0%";
  const kpi = (label, val, wide) =>
    "<div class='kpi" + (wide ? " wide" : "") + "'><span>" + label + "</span><b>" + val + "</b></div>";

  $("#perf").innerHTML =
    "<div class='kpis'>" +
      kpi("לידים", n) +
      kpi("קיבלו מדריך", sent + " · " + pct(sent, n)) +
      kpi("פתחו", opened + " · " + pct(opened, sent)) +
      kpi("קראו באמת", realRead + " · " + pct(realRead, opened)) +
      kpi("פגישות שהתקיימו", met) +
      kpi("חתמו בלעדיות", excl) +
      kpi("נמכרו", sold) +
      kpi("הכנסה מדמי תיווך", revenue ? "₪" + revenue.toLocaleString("he-IL") : "0") +
    "</div>" +
    "<div class='note'><b>עלות לליד, עלות לפגישה ו־ROAS יופיעו כאן ברגע שתרוץ תנועה בתשלום.</b><br>" +
    "המדידה בנויה ומחכה. בלי הוצאה על פרסום המספרים האלה הם אפסים שרק מבלבלים, " +
    "ולכן הם מקופלים ולא מוצגים.</div>" +
    "<div class='note'>המספר שהכי שווה להסתכל עליו כאן הוא <b>קראו באמת</b>. " +
    "הוא סופר רק מי ששהה במדריך לפחות ארבע דקות והגיע לפחות לחצי. " +
    "אלה האנשים שכדאי להרים אליהם טלפון קודם.</div>";
}

async function load() {
  try {
    const d = await api("/leads");
    LEADS = d.leads || [];
    if (d.statuses) STATUSES = d.statuses;
    if ($("#fs").options.length <= 1) {
      $("#fs").innerHTML = "<option value=''>כל הסטטוסים</option>" +
        STATUSES.map(s => "<option>" + esc(s) + "</option>").join("");
    }
    TAB === "leads" ? render() : renderPerf();
  } catch (err) { /* 401 already handled */ }
}

// ── actions ─────────────────────────────────────────────────────────
function pushUndo(fn) { UNDO.push(fn); $("#undo").disabled = false; }

async function sendGuide(id) {
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  window.open(wa(l.phone, guideMsg(l)), "_blank");
  await api("/leads/" + id + "/sent", { method: "POST" });
  toast("סומן כנשלח");
  load();
}

async function sendNudge(id) {
  const l = LEADS.find(x => x.id === id);
  const n = l && nudge(l);
  if (!n) return;
  window.open(wa(l.phone, n.msg), "_blank");
  await api("/leads/" + id + "/followup", { method: "POST", body: JSON.stringify({ kind: n.kind }) });
  toast("המעקב נרשם");
  load();
}

async function patch(id, body) {
  const before = LEADS.find(x => x.id === id) || {};
  const undoBody = {};
  Object.keys(body).forEach(k => { undoBody[k] = before[k] == null ? "" : before[k]; });
  await api("/leads/" + id, { method: "PATCH", body: JSON.stringify(body) });
  pushUndo(async () => {
    await api("/leads/" + id, { method: "PATCH", body: JSON.stringify(undoBody) });
    toast("בוטל");
  });
  await load();
}

function csv() {
  const head = ["שם", "טלפון", "אימייל", "כתובת", "סטטוס", "נשלח מדריך",
                "פתיחות", "עומק", "דקות קריאה", "נכנס"];
  const body = filtered().map(l => [l.name, l.phone, l.email || "", l.address || "", l.status,
    l.guide_sent ? "כן" : "לא", l.opens, l.read_depth + "%",
    ((l.read_seconds || 0) / 60).toFixed(1), (l.created_at || "").slice(0, 10)]);
  const text = "﻿" + [head].concat(body)
    .map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = "leads-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
}

// ── modal ───────────────────────────────────────────────────────────
async function openLead(id) {
  const l = LEADS.find(x => x.id === id);
  if (!l) return;
  const sold = l.status === "נמכר";
  const v = verdict(l);
  $("#sheet").innerHTML =
    "<h2>" + esc(l.name) + "</h2>" +
    "<div class='sub'>" + esc(l.phone) + (l.email ? " · " + esc(l.email) : "") + "</div>" +

    "<label class='lbl'>סטטוס</label>" +
    "<select id='m_status'>" + STATUSES.map(s =>
      "<option" + (s === l.status ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select>" +

    "<div id='m_comm' style='display:" + (sold ? "block" : "none") + "'>" +
      "<label class='lbl'>דמי תיווך שהתקבלו, בשקלים</label>" +
      "<input id='m_commission' inputmode='numeric' value='" + esc(l.commission || "") + "'></div>" +

    "<label class='lbl'>כתובת הנכס</label>" +
    "<input id='m_address' value='" + esc(l.address || "") + "'>" +

    "<label class='lbl'>הערות</label>" +
    "<textarea id='m_notes' placeholder='מה נאמר בשיחה, מה חשוב לזכור'>" + esc(l.notes || "") + "</textarea>" +

    "<div class='row2'><div><label class='lbl'>קישור למסמך</label>" +
      "<input id='m_doc' value='" + esc(l.doc_url || "") + "' dir='ltr'></div>" +
      "<div><label class='lbl'>תזכורת</label>" +
      "<input id='m_rem' type='date' value='" + esc((l.reminder_at || "").slice(0, 10)) + "'></div></div>" +

    "<div class='hist' id='m_hist'>" +
      "<span class='k'>נכנס</span> " + ago(l.created_at) +
      " · <span class='k'>מדריך</span> " + (l.guide_sent_at ? "נשלח " + ago(l.guide_sent_at) : "טרם נשלח") +
      (l.opens ? "<br><span class='k'>קריאה</span> " + v.t + " · " + l.opens + " פתיחות · " +
                 mins(l.read_seconds) + " · " + l.read_depth + "%" : "") +
      "<br><span class='k'>קישור אישי</span> <span dir='ltr'>" + SITE + "/madrich/" + esc(l.token) + "</span>" +
      "<br><button class='copy' id='m_copy'>העתקת הקישור</button>" +
    "</div>" +

    "<div class='mact'><button class='cancel' id='m_x'>סגירה</button>" +
    "<button class='save' id='m_ok'>שמירה</button></div>";

  $("#m_status").onchange = e => {
    $("#m_comm").style.display = e.target.value === "נמכר" ? "block" : "none";
  };
  $("#m_copy").onclick = () => {
    navigator.clipboard.writeText(SITE + "/madrich/" + l.token).then(() => toast("הקישור הועתק"));
  };
  $("#m_x").onclick = () => $("#modal").classList.remove("on");
  $("#m_ok").onclick = async () => {
    const body = {
      status: $("#m_status").value,
      address: $("#m_address").value,
      notes: $("#m_notes").value,
      doc_url: $("#m_doc").value,
      reminder_at: $("#m_rem").value || null,
    };
    const c = parseFloat($("#m_commission") ? $("#m_commission").value : "");
    if (!isNaN(c)) body.commission = c;
    $("#modal").classList.remove("on");
    await patch(id, body);
    toast("נשמר");
  };
  $("#modal").classList.add("on");

  // the history loads after the sheet is already on screen, so opening stays instant
  try {
    const d = await api("/leads/" + id + "/events");
    if (!d.events || !d.events.length) return;
    const label = { status: "סטטוס", guide_sent: "מדריך נשלח", followup: "מעקב נשלח" };
    $("#m_hist").insertAdjacentHTML("beforeend",
      "<br><span class='k'>היסטוריה</span><br>" + d.events.slice(0, 8).map(e =>
        "· " + (label[e.kind] || e.kind) + (e.detail ? " " + esc(e.detail) : "") + " · " + ago(e.at)
      ).join("<br>"));
  } catch (err) { /* history is a nicety, never a blocker */ }
}

function addLead() {
  $("#sheet").innerHTML =
    "<h2>ליד חדש</h2><div class='sub'>מישהו שהגיע אליך מחוץ לדף. הוא יקבל קישור אישי משלו.</div>" +
    "<label class='lbl'>שם מלא</label><input id='a_name'>" +
    "<label class='lbl'>טלפון</label><input id='a_phone' inputmode='tel' dir='ltr'>" +
    "<label class='lbl'>אימייל</label><input id='a_email' dir='ltr'>" +
    "<label class='lbl'>כתובת הנכס</label><input id='a_address'>" +
    "<div class='mact'><button class='cancel' id='a_x'>ביטול</button>" +
    "<button class='save' id='a_ok'>הוספה</button></div>";
  $("#a_x").onclick = () => $("#modal").classList.remove("on");
  $("#a_ok").onclick = async () => {
    const b = {
      name: $("#a_name").value.trim(), phone: $("#a_phone").value.trim(),
      email: $("#a_email").value.trim(), address: $("#a_address").value.trim(),
    };
    if (!b.name || b.phone.replace(/\D/g, "").length < 9) { toast("צריך שם וטלפון תקין"); return; }
    $("#modal").classList.remove("on");
    await api("/leads", { method: "POST", body: JSON.stringify(b) });
    toast("נוסף");
    load();
  };
  $("#modal").classList.add("on");
}

// ── wiring ──────────────────────────────────────────────────────────
$("#go").onclick = login;
$("#p").onkeydown = e => { if (e.key === "Enter") login(); };
$("#u").onkeydown = e => { if (e.key === "Enter") $("#p").focus(); };
$("#out").onclick = logout;
$("#add").onclick = addLead;
$("#q").oninput = () => TAB === "leads" ? render() : renderPerf();
$("#fs").onchange = $("#q").oninput;
$("#fd").onchange = $("#q").oninput;
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("on"); };

$("#t_leads").onclick = () => switchTab("leads");
$("#t_perf").onclick = () => switchTab("perf");
function switchTab(t) {
  TAB = t;
  $("#t_leads").classList.toggle("on", t === "leads");
  $("#t_perf").classList.toggle("on", t === "perf");
  $("#leadsView").style.display = t === "leads" ? "block" : "none";
  $("#perf").style.display = t === "perf" ? "block" : "none";
  t === "leads" ? render() : renderPerf();
}

$("#undo").onclick = async () => {
  const step = UNDO.pop();
  if (!step) return;
  await step();
  $("#undo").disabled = !UNDO.length;
  load();
};

$("#list").onclick = e => {
  const b = e.target.closest("button");
  if (b) {
    if (b.dataset.send)  return sendGuide(b.dataset.send);
    if (b.dataset.nudge) return sendNudge(b.dataset.nudge);
    if (b.dataset.open)  return openLead(b.dataset.open);
    const l = LEADS.find(x => x.id === (b.dataset.wa || b.dataset.tel));
    if (!l) return;
    if (b.dataset.wa) window.open(wa(l.phone, ""), "_blank");
    if (b.dataset.tel) location.href = "tel:" + l.phone;
    return;
  }
  const card = e.target.closest(".card");
  if (card) openLead(card.dataset.id);
};

// long press the header title exports what is on screen
$(".who").addEventListener("dblclick", csv);

function start() {
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  load();
  if (timer) clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) load(); }, POLL);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}

if (TOKEN) {
  api("/leads").then(d => { STATUSES = d.statuses || []; start(); }).catch(() => {});
}
</script>
