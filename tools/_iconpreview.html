<!doctype html>
<html dir="rtl" lang="he"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#14161A;font-family:Heebo,Arial,sans-serif;direction:rtl;padding:30px 26px;color:#F1EDE7}
h4{font-size:12px;letter-spacing:.14em;color:#8A8580;font-weight:500;margin:0 0 16px}
.row{display:flex;gap:14px;margin-bottom:34px;flex-wrap:wrap}
.cell{background:#1B1E23;border:1px solid #2A2E34;border-radius:14px;padding:16px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;width:132px}
.lbl{font-size:10.5px;color:#8A8580;text-align:center;line-height:1.35}
.big .box{width:96px;height:96px}
.mid .box{width:56px;height:56px}
.sm .box{width:38px;height:38px}
.light{background:#FAF8F5}
.light .cell{background:#fff;border-color:#E2DCD3}
.light .lbl{color:#8C8781}
.strip{padding:26px;border-radius:16px;margin-bottom:34px}
</style></head><body>

<h4>96 פיקסל · על רקע כהה</h4>
<div class="row big" id="r1"></div>

<h4>56 פיקסל · הגודל המשוער בטיימליין</h4>
<div class="row mid" id="r2"></div>

<h4>38 פיקסל · מבחן קריאות בקטן</h4>
<div class="row sm" id="r3"></div>

<div class="strip light">
  <h4 style="color:#8C8781">אותם קבצים על רקע בהיר · בדיקה אם צריך סט שני</h4>
  <div class="row mid" id="r4"></div>
</div>

<script src="../assets/lottie_light.min.js"></script>
<script>
var ICONS=[["01-pricing","תמחור ואסטרטגיה"],["02-prep","הכנה וצילום"],["03-dossier","תיק נכס מקצועי"],
["04-database","חשיפה קודם למאגר"],["05-network","שיתוף פעולה איזורי"],["06-filter","סינון קונים"],
["07-close","ביקורים, מו״מ ושקיפות"]];
var SEEK=parseFloat(location.hash.slice(1))||0.72;   // fraction of the timeline to freeze on
var pending=ICONS.length*4;
["r1","r2","r3","r4"].forEach(function(rid){
  var row=document.getElementById(rid);
  ICONS.forEach(function(ic){
    var cell=document.createElement("div"); cell.className="cell";
    var box=document.createElement("div"); box.className="box";
    var lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=ic[1];
    cell.appendChild(box); cell.appendChild(lbl); row.appendChild(cell);
    var a=lottie.loadAnimation({container:box,renderer:"svg",loop:true,autoplay:false,
      path:"../assets/"+ic[0]+".json"});
    a.addEventListener("DOMLoaded",function(){
      a.setSpeed(0.75);
      a.goToAndStop(Math.round(a.totalFrames*SEEK),true);
      if(--pending===0) document.title="READY";
    });
  });
});
</script>
</body></html>
